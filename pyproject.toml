[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-agent"
version = "1.2.18"
description = "A streamlined local agent with PyQt6 GUI, OpenAI-compatible LLM, and pluggable tools."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # MCP 协议统一由 fastmcp 4.x 实现：mcp_client.py（连接外部 server，核心
    # 路径）+ rag_mcp_server.py（对外暴露 RAG）。协议版本协商、三种传输、
    # tools/resources/prompts 都由它负责，因此不再是可选依赖。
    "fastmcp>=4.0",
]

[project.optional-dependencies]
# pytest-qt 提供 `qapp` / `qtbot` fixture —— tests/test_bridge.py 与
# tests/test_integration.py 依赖它构造 MainWindow；缺了这两个文件的用例
# 会全部在 setup 阶段报 "fixture 'qapp' not found"。
test = ["pytest>=8.0", "pytest-qt>=4.0"]
# RAG / knowledge base support: vector store + embedding + reranker + parsers
rag = [
    # lancedb 0.26+ 不再提供 macOS x86_64 (Intel) 的 wheel（仅 ARM64），
    # 故锁定 <0.26。代码已兼容 0.25 与 0.37 两种 FTS API（见 vector_store.py
    # _ensure_fts_index），在 ARM64 机器上可放宽至 0.37。
    "lancedb>=0.17.0,<0.26",
    "pyarrow>=15.0.0",
    "numpy>=1.24.0",
    # fastembed 同时提供 embedding (nomic-embed-text) 与 reranker
    # (bge-reranker-v2-m3, 经 TextCrossEncoder)，reranker 不再依赖
    # FlagEmbedding / torch / transformers。
    "fastembed>=0.9.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.0.0",
    "python-pptx>=0.6.0",
    "PyMuPDF>=1.23.0",
    "ebooklib>=0.18",
    "pymupdf4llm<2",
    "chonkie[semantic]>=1.0.0",
    # 语义切片快路径：model2vec 静态嵌入（potion-base-32M）驱动 chonkie 的
    # SemanticChunker——切片决策只比较相邻窗口的相对相似度，不需要与检索
    # 向量同空间，静态嵌入（纯 numpy 查表）比 BERT 前向快约两个数量级
    # （88k 字符章节 90-150s → 0.4s，#118）。缺失时自动回退共享 nomic
    # 适配器（慢但正确）。
    "model2vec>=0.3",
    "docling>=2.0.0",
    # BM25 hybrid retrieval: 原生 FTS (simple tokenizer) + jieba CJK 预分词
    "jieba>=0.42",
    # 知识图谱内存图（rag/kg/graph.py 基于 nx.Graph 无向图）；pydantic 供
    # llm_pydantic 三元组抽取方案做结构化校验（fastmcp 亦传递依赖）。
    "networkx>=3.0",
    "pydantic>=2.0",
]
# KG 三元组抽取的 GLiNER 方案（可选，不基于 LLM 的本地 NER）：包较重
# （torch/transformers），且首次使用需下载 NER 模型权重，故独立 extra。
gliner = ["gliner>=0.2"]
# PDF OCR (optional, heavy dependency ~500MB)
# rapidocr 3.x 起为统一包名（兼容层 rapidocr-onnxruntime 仅供旧环境回退，
# 见 parsers._get_ocr_engine）；模型目录与 docling 共享，且支持 CoreML EP。
ocr = ["rapidocr>=3.10"]
# MCP server（2025 streamable-HTTP）：将 RAG 能力以 MCP 工具形式对外暴露，
# 供其它大模型应用对接（需启用 rag 可选依赖）。fastmcp 现已是核心依赖，这里
# 保留同名 extra，避免旧的 `pip install "base-agent[mcp]"` 命令/脚本失效。
# 代码使用 fastmcp 4.x API（Client / http_app() / run(transport="stdio") /
# StdioTransport / StreamableHttpTransport / SSETransport），故锁定 >=4.0。
mcp = ["fastmcp>=4.0"]
# All optional features
#all = ["base-agent[test,rag,ocr,mcp]"]

[project.scripts]
base-agent = "agent.ui.main_window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
